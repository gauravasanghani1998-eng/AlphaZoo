name: alpha_zoo
description: "AlphaZoo - A-Z Alphabet learning app for kids"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.7
  flutter_tts: ^4.0.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  flame: ^1.33.0
  vibration: ^3.1.5
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Images
    - assets/images/
    - assets/images/app_logo.png
    - assets/images/placeholder.png
    - assets/images/a.png
    - assets/images/b.png
    - assets/images/c.png
    - assets/images/d.png
    - assets/images/e.png
    - assets/images/f.png
    - assets/images/g.png
    - assets/images/h.png
    - assets/images/i.png
    - assets/images/j.png
    - assets/images/k.png
    - assets/images/l.png
    - assets/images/m.png
    - assets/images/n.png
    - assets/images/o.png
    - assets/images/p.png
    - assets/images/q.png
    - assets/images/r.png
    - assets/images/s.png
    - assets/images/t.png
    - assets/images/u.png
    - assets/images/v.png
    - assets/images/w.png
    - assets/images/x.png
    - assets/images/y.png
    - assets/images/z.png

    # Lottie (optional)
    - assets/lottie/

    # Flame (optional)
    - assets/flame/
    # Localization
    - assets/translations/
